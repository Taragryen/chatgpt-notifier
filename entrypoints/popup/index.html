<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="card">
    <div class="header">
      <label>Volume</label>
      <div class="value-display"><span id="volumeValue">50</span>%</div>
    </div>
    <div class="slider-container">
      <input type="range" id="volumeSlider" min="0" max="1" step="0.01">
    </div>
    <button class="section-header" id="soundHeader">
      <span>Sound</span>
      <span class="chevron" id="soundChevron"></span>
    </button>
    <div class="sound-options" id="soundOptions">
      <div class="sound-list" id="soundList"></div>
      <div class="custom-sound-controls" id="customSoundControls">
        <input type="file" id="customSoundInput" accept="audio/*,.mp3,.wav,.ogg,.m4a,.aac,.flac,.webm" hidden>
        <button class="secondary-button" id="chooseCustomSound" type="button">Choose Sound File</button>
        <div class="custom-sound-hint" id="customSoundHint">MP3, WAV, OGG, and other browser-playable audio · up to 5 MB</div>
        <div class="custom-sound-meta" id="customSoundMeta" hidden>
          <span class="custom-sound-name" id="customSoundName"></span>
          <div class="custom-sound-actions">
            <button class="text-button" id="previewCustomSound" type="button">Preview</button>
            <button class="text-button" id="resetCustomSound" type="button">Remove</button>
          </div>
        </div>
        <div class="custom-sound-status" id="customSoundStatus" aria-live="polite"></div>
      </div>
    </div>
    <div class="toggle-row">
      <label for="systemNotifyToggle">System Notification</label>
      <label class="switch">
        <input type="checkbox" id="systemNotifyToggle">
        <span class="switch-slider"></span>
      </label>
    </div>
    <div class="hint-text">Show a desktop alert when ChatGPT finishes responding.</div>
    <div class="footer">
      <span class="version" id="versionLabel"></span>
      <a class="github-link" href="https://github.com/Taragryen/chatgpt-notifier" target="_blank" title="GitHub">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
        </svg>
      </a>
    </div>
  </div>
  <script type="module" src="./App.ts"></script>
</body>
</html>
